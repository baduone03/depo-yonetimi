[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-optimizer"
version = "0.1.0"
description = "Warehouse Intelligence & Slotting Optimizer — depo yerleşim analizi ve önce/sonra simülasyonu (MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.1",
    "numpy>=1.26",
    "plotly>=5.20",
    "networkx>=3.2",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
